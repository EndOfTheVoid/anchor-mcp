[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anchor-mcp"
version = "0.1.0"
description = "A local-first MCP server that grounds LLMs in a Google Drive corpus with source-cited retrieval and BYOK faithfulness verification."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Atharva", email = "coderboi108@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
    "pinecone>=3.0",
    "google-cloud-storage>=2.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "cryptography>=42.0",
    "tiktoken>=0.7",
    "tenacity>=8.0",
    "PyJWT>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.scripts]
anchor = "anchor_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anchor_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
