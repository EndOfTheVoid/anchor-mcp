steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/anchor-mcp:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/anchor-mcp:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - anchor-mcp
      - --image=gcr.io/$PROJECT_ID/anchor-mcp:$SHORT_SHA
      - --region=us-central1
      - --service-account=anchor-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --set-secrets=PINECONE_API_KEY=PINECONE_API_KEY:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,GOOGLE_SERVICE_ACCOUNT_KEY=GOOGLE_SERVICE_ACCOUNT_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,JWT_SECRET=JWT_SECRET:latest
      - --set-env-vars=GCS_BUCKET=anchor-$PROJECT_ID-state,ANCHOR_DRIVE_FOLDER_ID=${_DRIVE_FOLDER_ID},SERVER_URL=${_SERVER_URL},ANCHOR_JUDGE_MODEL=${_JUDGE_MODEL}
      - --port=8080
      - --memory=1Gi
      - --timeout=900

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - curl -sf "${_SERVER_URL}/health"

images:
  - gcr.io/$PROJECT_ID/anchor-mcp:$SHORT_SHA

# A trigger that runs as a user-specified service account must declare a logging
# option (Cloud Build won't pick a default logs bucket for it).
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # Deploy targets for this project. Override per-trigger if you fork the deploy.
  _DRIVE_FOLDER_ID: "1cxUYzyu6ovglUAoZF9yvxyS8NWphNFTa"
  _SERVER_URL: "https://anchor-mcp-778459062218.us-central1.run.app"
  # Model that verify_claim sends to OpenRouter. A standard (non-":free") Mistral
  # slug routes through your own Mistral key (BYOK) instead of OpenRouter credits.
  _JUDGE_MODEL: "mistralai/mistral-small-3.2-24b-instruct"
